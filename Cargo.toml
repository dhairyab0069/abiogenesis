[package]
name = "abiogenesis"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "A toy simulation of abiogenesis: molecules and amino acid chains in a primordial soup"
repository = "https://github.com/dhairyab0069/abiogenesis"

[dependencies]
eframe = "0.36"
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The animals run simulates 1600 generations of ~200 animals up front, which is far too
# slow in an unoptimised debug or test build (minutes), so debug builds are lightly optimised.
[profile.dev]
opt-level = 1
