# Builds the macOS .dmg and Windows setup .exe. Pull requests build them as
# workflow artifacts to prove packaging works; version tags (or a manual run
# with a tag) also attach them to the GitHub release.
name: Package

on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/package.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and upload to (leave empty to only build artifacts)
        required: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Read version from Cargo.toml
        id: ver
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "could not read version"; exit 1; }
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build dmg
        run: packaging/macos/build-dmg.sh ${{ matrix.target }} ${{ steps.ver.outputs.version }} dist/Abiogenesis-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
      - name: Upload to release
        if: env.TAG != ''
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
    # Writing to the release needs contents: write, and only on tag runs.
    permissions:
      contents: write

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Read version from Cargo.toml
        id: ver
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "could not read version"; exit 1; }
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc && rustup default stable
        shell: bash
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\abiogenesis.exe"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=$exe" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: packaging/windows/out/*.exe
          if-no-files-found: error
      - name: Upload to release
        if: env.TAG != ''
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" packaging/windows/out/*.exe --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
